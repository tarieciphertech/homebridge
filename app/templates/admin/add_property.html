{% extends 'base.html' %}{% block title %}Add Property{% endblock %}{% block content %}<div class="container py-5"><div class="d-flex justify-content-between mb-4"><h2>Add Property</h2><a class="btn btn-outline-light" href="{{url_for('admin_bp.properties')}}">Back</a></div><div class="card p-4"><form method="post" enctype="multipart/form-data"><div class="row g-3"><div class="col-12"><label class="form-label">Title</label><input class="form-control" name="title" required></div><div class="col-md-4"><label class="form-label">Listing Type</label><select class="form-select" name="listing_type"><option value="sale">Sale</option><option value="rent">Rent</option><option value="lease">Lease</option></select></div><div class="col-md-4"><label class="form-label">Property Type</label><select class="form-select" name="property_type"><option>house</option><option>apartment</option><option>land</option><option>commercial</option><option>office</option></select></div><div class="col-md-4"><label class="form-label">Price</label><input class="form-control" name="price" required></div><div class="col-md-6"><label class="form-label">Location</label><input class="form-control" name="location" required></div><div class="col-md-3"><label class="form-label">City</label><input class="form-control" name="city" required></div><div class="col-md-3"><label class="form-label">Country</label><input class="form-control" name="country" value="Zimbabwe"></div><div class="col-md-4"><label class="form-label">Bedrooms</label><input class="form-control" type="number" name="bedrooms" min="0"></div><div class="col-md-4"><label class="form-label">Bathrooms</label><input class="form-control" type="number" name="bathrooms" min="0"></div><div class="col-md-4"><label class="form-label">Size (m²)</label><input class="form-control" name="size_sqm"></div><div class="col-12"><label class="form-label">Features</label><input class="form-control" name="features" placeholder="Pool, Garage, Garden"></div><div class="col-12"><label class="form-label">Description</label><textarea class="form-control" name="description" rows="5" required></textarea></div><div class="col-12"><label class="form-label">Photos</label><input class="form-control" type="file" name="images" accept="image/*" multiple></div><div class="col-12"><label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="is_managed"> Managed</label><label class="form-check form-check-inline"><input class="form-check-input" type="checkbox" name="is_featured"> Featured</label></div><div class="col-12"><button class="btn btn-gold px-5">Add & Publish</button></div></div></form></div></div>{% endblock %}

{% extends 'base.html' %}
{% block title %}Business Settings · HomeBridge{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div><h1>Business Settings</h1><p class="text-muted mb-0">Configure platform fees without changing application code.</p></div>
    <a class="btn btn-outline-light" href="{{ url_for('admin_bp.dashboard') }}">Dashboard</a>
  </div>

  <form method="post" class="card p-4">
    <h4>Platform Fees</h4>
    <div class="row g-3">
      <div class="col-md-4"><label class="form-label">Student service fee</label><input class="form-control" type="number" min="0" step="0.01" name="student_service_fee" value="{{ student_service_fee }}"><div class="form-text">Set to 0 to disable the student fee gate.</div></div>
      <div class="col-md-4"><label class="form-label">Student fee currency</label><input class="form-control" maxlength="10" name="student_service_fee_currency" value="{{ student_service_fee_currency }}"></div>
      <div class="col-md-4"><label class="form-label">Landlord listing fee</label><input class="form-control" type="number" min="0" step="0.01" name="landlord_listing_fee" value="{{ landlord_listing_fee }}"></div>
    </div>
    <div class="mt-4"><button class="btn btn-gold" type="submit">Save Settings</button></div>
  </form>
</div>
{% endblock %}

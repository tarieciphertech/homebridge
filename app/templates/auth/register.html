{% extends 'base.html' %}{% block title %}Register{% endblock %}{% block content %}<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card p-4"><h2>List Your Property</h2><p class="text-muted">Create an agent account.</p><form method="post"><label class="form-label">Full Name</label><input class="form-control mb-3" name="name" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Phone</label><input class="form-control mb-3" name="phone" required><label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" minlength="6" required><div class="alert alert-info">Private listings use the configured listing fee. Managed properties can be configured as free listings.</div><button class="btn btn-gold w-100">Create Account</button></form><p class="text-center text-muted mt-3 mb-0">Already registered? <a href="{{url_for('auth.login')}}">Login</a></p></div></div></div></div>{% endblock %}

{% extends 'base.html' %}
{% block title %}Create Account · Lexxi Cipher{% endblock %}
{% block content %}
<div class="container py-5"><div class="row justify-content-center"><div class="col-md-6"><div class="card p-4">
<h2>Create your account</h2><p class="text-muted">Choose how you will use Lexxi Cipher.</p>
<form method="post">
<label class="form-label">Account Type</label><select class="form-select mb-3" name="role" required><option value="student">Student — find accommodation</option><option value="landlord">Landlord — list and manage property</option></select>
<label class="form-label">Full Name</label><input class="form-control mb-3" name="name" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Phone</label><input class="form-control mb-3" name="phone">
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" minlength="6" required>
<button class="btn btn-gold w-100">Create Account</button>
</form><p class="text-center text-muted mt-3 mb-0">Already registered? <a href="{{url_for('auth.login')}}">Login</a></p>
</div></div></div></div>
{% endblock %}
